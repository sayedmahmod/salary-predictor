[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salarykit"
version = "0.1.0"
description = "Normalise heterogeneous salary sources, classify job titles, predict salary bands"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "openpyxl>=3.1",
    # Pinned: the tracked joblib artefacts were fitted with this version and
    # sklearn warns about unpickling across versions. Retrain when you bump it.
    "scikit-learn==1.9.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]
embed = ["sentence-transformers>=3.0"]

[project.scripts]
salarykit-build = "salarykit.build:main"
salarykit-title = "salarykit.titles.cli:main"
salarykit-salary = "salarykit.salary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
